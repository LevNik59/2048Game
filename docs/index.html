<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>2048</title>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
</head>
<body>
<script>
(async function () {
    console.log("1. Инициализация CheerpJ...");
    await cheerpjInit({ version: 17 });
    console.log("2. Готово! Создаю дисплей...");
    cheerpjCreateDisplay(700, 700);
    console.log("3. Загружаю JAR...");
    await cheerpjRunJar("/app/2048Game/2048.jar");
    console.log("4. JAR запущен!");
})();
</script>
</body>
</html>
